name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.event.release.tag_name }}

  upload:
    name: Attach jars
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Every node uploaded its jar as a separate, non-zipped artifact
      - uses: actions/download-artifact@v8
        with:
          path: jars
          merge-multiple: true

      - name: Upload jars to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" jars/*.jar --repo "$GITHUB_REPOSITORY" --clobber
